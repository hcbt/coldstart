{{- /*
Optional: syncs 1Password items into Secrets that `env` can reference, for
clusters running the 1Password Kubernetes operator. Every field of the item
becomes a key of the Secret.

Any other way of producing those Secrets works just as well — this is a
convenience, not a dependency. Until the item exists the operator does not
create the Secret and the pod stays Pending on the missing reference.
*/ -}}
{{- range $i, $item := .Values.onePasswordItems }}
{{- if not $item.name }}
{{- fail (printf "coldstart: onePasswordItems[%d] has no name" $i) }}
{{- end }}
{{- if not $item.itemPath }}
{{- fail (printf "coldstart: onePasswordItems[%d] (%s) has no itemPath" $i $item.name) }}
{{- end }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ $item.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "coldstart.labels" $ | nindent 4 }}
spec:
  itemPath: {{ $item.itemPath | quote }}
{{- end }}
